<div class="container">
  <div class="search-container">
    <label for="title">Title</label>
    <input
      type="text"
      #movieTitle
      id="title"
      placeholder="Search for movies... (e.g. Hope)"
      (input)="getMovieByTitle(movieTitle.value)"
    />

    @if (movieTitle.value) {
      <button class="clear-btn" type="button" (click)="clearSearch(movieTitle)" title="Clear search">
        <fa-icon [icon]="faXmark" />
      </button>
    } @else {
      <fa-icon [icon]="faMagnifyingGlass" />
    }
  </div>
</div>
